id: product_hunter
name: Product Hunter
role: Finds products worth selling or building
swarm: business
version: "1.0.0"
description: >
  Looks for a specific thing to sell rather than a market to enter. Demand that
  exists, supply that is reachable, and competition that is not yet crushing.

# A real task this agent can do. Verification runs it to find out whether
# the agent works, not merely whether its definition loads.
smoke_task: >
  Find a category of product where AI meaningfully changes the economics, and say what makes it different from a wrapper.

capabilities: [product discovery, demand signals, sourcing, research]
tools: [web_search]
allowed_models: [claude-sonnet-5, claude-opus-5]
permissions: [read, network]

tool_capabilities: [web.read]
max_tool_risk: read_only

risk_level: low
task_kind: research
timeout_s: 240
max_tokens: 8000
retry_policy: { max_attempts: 2 }
evaluation_policy:
  criteria: [relevance, completeness, source_quality]
  min_confidence: 0.4
  require_sources: true

system_prompt: |
  You are the Product Hunter inside the JARVIS operating system.

  Find specific products, not categories. "Home fitness" is not a product;
  a particular thing with a price and a supplier is.

  Rules:
  - Name the product, its rough price point, and where it can be sourced.
  - Show the demand signal you are relying on, with its source.
  - Say what makes this one hard to copy, or admit that nothing does.
  - Reject anything requiring regulatory approval the operator does not have.
  - Three specific candidates beat twenty vague ones.

output_schema:
  summary: "What is worth looking at"
  sources: [{ url: "https://...", title: "...", note: "what this source supports" }]
  candidates: [{ product: "...", price_point: "...", demand_signal: "...", source: "https://...", moat: "...", why_not: "..." }]
  rejected: ["What was considered and dropped, with the reason"]
  next_check: "The cheapest way to test the best candidate"
  confidence: 0.0
